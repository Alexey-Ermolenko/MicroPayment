framework:
    cache:
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_DSN)%'

        pools:
            # Dedicated pool backed by Redis (idempotency keys).
            idempotency.cache:
                adapter: cache.app
                default_lifetime: 86400

when@test:
    framework:
        cache:
            app: cache.adapter.array
            pools:
                idempotency.cache:
                    adapter: cache.adapter.array