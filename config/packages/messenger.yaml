framework:
    messenger:
        failure_transport: failed

        transports:
            events_kafka: '%env(KAFKA_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\Command: events_kafka
            App\Message\DomainEvent: events_kafka

when@test:
    framework:
        messenger:
            transports:
                events_kafka: 'sync://'
                failed: 'in-memory://'